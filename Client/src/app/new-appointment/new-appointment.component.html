
<div class="container" style="min-height: 100vh; margin-top: 100px">

  <form #appointmentForm="ngForm" (ngSubmit)="submit()" class="my-auto" autocomplete="off">
    @if (this.step == 0) {
      <h2>Guest</h2>
    <select id="nickname" name="nickname" [(ngModel)]="appointment.guest.name" class="form-select me-2 mt-3" aria-label="Nickname">
      <option value="" disabled selected>Select a nickname</option>
      <option *ngFor="let nick of (nicknames)" [value]="nick">{{ nick }}</option>
    </select>
    }
    @if (this.step == 1) {
      <h2>Time</h2>
      <label for="startTime" class="form-label">Begin</label>
      <timepicker id="startTime" name="startTime" [(ngModel)]="appointment.startTime" [showMeridian]=false [showSpinners]=false></timepicker>
      <label for="endTime" class="form-label">End</label>
      <timepicker id="endTime" name="endTime" [(ngModel)]="appointment.endTime" [showMeridian]=false [showSpinners]=false></timepicker>
    }
    @if (this.step == 2) {
      <h2>Device</h2>
    <input type="text" id="kindProduct" name="kindProduct" [(ngModel)]="appointment.device.kindProduct" class="form-control me-2 mt-3" placeholder="Device Type">

    <input type="text" id="devicecategory" name="devicecategory" [(ngModel)]="appointment.device.category" class="form-control me-2 mt-3" placeholder="Device Category">

    <input type="text" id="fault" name="tault" [(ngModel)]="appointment.device.fault" class="form-control me-2 mt-3" placeholder="Fault">

    <input type="text" id="brand" name="brand" [(ngModel)]="appointment.device.brand" class="form-control me-2 mt-3" placeholder="Brand">

    <input type="number" id="productBuildYear" name="productBuildYear" [(ngModel)]="appointment.device.productBuildYear" class="form-control me-2 mt-3" placeholder="Build Year">

    <input type="text" id="model" name="model" [(ngModel)]="appointment.device.model" class="form-control me-2 mt-3" placeholder="model">
    }
    @if (this.step > 0) {
    <button class="btn btn-success mt-3 me-3" type="button" (click)="back()">Back</button>
    }
    <button class="btn btn-success mt-3" type="submit">{{step < stepCnt? 'Next' : 'Submit'}}</button>
  </form>
</div>
